<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vijf — Dutch flashcards</title>
<meta name="description" content="A five-box Leitner system for learning Dutch words.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eae9e5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101318">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/favicon.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="vijf">
<style>
  /* Colour tokens from the vijf design system (design/tokens.json). Dark values follow the
     device setting. Never use a literal colour in a rule below; pair every fill with its on-* token. */
  :root {
    --paper: #eae9e5;
    --card: #ffffff;
    --ink: #14181f;
    --on-ink: #eae9e5;
    --on-ink-accent: #ffc917;
    --mute: #65655e;
    --line: #c9c9c2;
    --signal: #ffc917;
    --on-signal: #14181f;
    --deep: #003082;
    --success: #1e7a3c;
    --on-success: #ffffff;
    --danger: #c8102e;
    --on-danger: #ffffff;
    color-scheme: light;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101318;
      --card: #1b2028;
      --ink: #ecece6;
      --on-ink: #14181f;
      --on-ink-accent: #0a3a9e;
      --mute: #9a9a93;
      --line: #343a44;
      --deep: #7fa6ff;
      --success: #5bd08a;
      --on-success: #14181f;
      --danger: #ff6b75;
      --on-danger: #14181f;
      color-scheme: dark;
    }
  }
  * , *::before, *::after { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    min-height: 100vh;
    max-width: 520px;
    margin: 0 auto;
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  }

  .eyebrow {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--mute);
  }

  .top {
    display: flex; align-items: flex-end; justify-content: space-between;
    border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 22px;
  }
  .wordmark { font-size: 34px; font-weight: 800; letter-spacing: -0.045em; line-height: 0.9; }
  .wordmark span { color: var(--deep); }
  .tally { font-family: var(--mono); font-size: 11px; color: var(--mute); text-align: right; line-height: 1.5; }
  .tally b { color: var(--ink); font-size: 15px; }

  .tray { display: flex; flex-direction: column; gap: 8px; }
  .slot {
    position: relative; display: grid; grid-template-columns: 40px 1fr auto;
    align-items: center; gap: 12px; background: var(--card);
    border: 1.5px solid var(--ink); padding: 14px 14px 14px 0;
    cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit;
    transition: transform 0.12s ease;
  }
  .slot:active { transform: translateX(3px); }
  .slot:focus-visible { outline: 3px solid var(--deep); outline-offset: 2px; }
  .slot .num {
    font-family: var(--mono); font-size: 13px; font-weight: 700; text-align: center;
    align-self: stretch; display: flex; align-items: center; justify-content: center;
    background: var(--ink); color: var(--on-ink); margin: -14px 0; padding: 14px 0;
  }
  .slot[data-full="1"] .num { background: var(--signal); color: var(--on-signal); }
  .slot .lbl { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
  .slot .sub {
    font-family: var(--mono); font-size: 10px; color: var(--mute);
    letter-spacing: 0.08em; text-transform: uppercase; margin-top: 3px;
  }
  .slot .cnt { font-family: var(--mono); font-size: 22px; font-weight: 700; min-width: 34px; text-align: right; }
  .slot[data-empty="1"] { border-color: var(--line); }
  .slot[data-empty="1"] .num { background: var(--line); color: var(--mute); }
  .slot[data-empty="1"] .cnt, .slot[data-empty="1"] .lbl { color: var(--mute); }
  .slot--deck { grid-template-columns: 1fr auto; padding-left: 16px; }
  .slot--deck .lbl, .slot--deck .sub { display: block; }

  /* Swipe a deck row left to reveal its delete button. */
  .swipe { position: relative; overflow: hidden; }
  .swipe .slot--deck { position: relative; z-index: 1; touch-action: pan-y; transition: width 0.2s ease; }
  .swipe.open .slot--deck { width: calc(100% - 96px); }
  .swipe__del {
    position: absolute; top: 0; right: 0; bottom: 0; width: 96px;
    background: var(--danger); color: var(--on-danger); border: none; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 700;
  }
  .swipe__del small {
    display: block; font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
    text-transform: uppercase; opacity: 0.75; margin-top: 3px; font-weight: 400;
  }
  .slot .cnt small { font-size: 13px; color: var(--mute); font-weight: 400; }
  .edges { display: flex; gap: 2px; margin-top: 7px; flex-wrap: wrap; }
  .edges i { display: block; width: 3px; height: 12px; background: var(--deep); }

  .row { display: flex; gap: 8px; margin-top: 22px; }
  .btn {
    flex: 1; font: inherit; font-size: 14px; font-weight: 700; letter-spacing: -0.01em;
    padding: 14px 12px; border: 1.5px solid var(--ink); background: transparent;
    color: var(--ink); cursor: pointer; border-radius: 0;
  }
  .btn:active { background: var(--ink); color: var(--on-ink); }
  .btn:focus-visible { outline: 3px solid var(--deep); outline-offset: 2px; }
  .btn--fill { background: var(--ink); color: var(--on-ink); }
  .btn--fill:active { opacity: 0.85; }
  .btn--ghost { border-color: var(--line); color: var(--mute); font-weight: 500; }
  .btn small {
    display: block; font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
    text-transform: uppercase; opacity: 0.6; margin-top: 3px; font-weight: 400;
  }

  .bar {
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--mute); margin-bottom: 14px;
  }
  .bar button { font: inherit; background: none; border: none; color: var(--mute); cursor: pointer; padding: 4px 0; }
  .bar button:active { color: var(--ink); }
  .crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .crumbs .here, .bar .here {
    color: var(--ink); max-width: 190px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  /* The deck list's "⋯" button and its menu (New deck, Backup). While it is open the rest of
     the screen fades back, and any tap outside it closes it. */
  .top { position: relative; }
  .more {
    width: 44px; height: 44px; padding: 0; font: inherit; font-size: 20px; font-weight: 800;
    line-height: 1; background: transparent; color: var(--ink); border: 1.5px solid var(--ink);
    border-radius: 0; cursor: pointer;
  }
  .more[aria-expanded="true"], .more:active { background: var(--ink); color: var(--on-ink); }
  .more:focus-visible { outline: 3px solid var(--deep); outline-offset: 2px; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 8px); z-index: 10; min-width: 180px;
    display: flex; flex-direction: column; background: var(--card); border: 1.5px solid var(--ink);
  }
  .menu button {
    font: inherit; font-size: 15px; font-weight: 700; text-align: left; padding: 14px 16px;
    background: none; border: none; border-bottom: 1px solid var(--line); color: var(--ink); cursor: pointer;
  }
  .menu button:last-child { border-bottom: none; }
  .menu button:active { background: var(--ink); color: var(--on-ink); }
  .menu button:focus-visible { outline: 3px solid var(--deep); outline-offset: -3px; }
  .top--open ~ * { opacity: 0.35; }

  /* Search across all decks. Results replace the deck rows while there is a query. */
  .search { position: relative; margin-bottom: 14px; }
  .search input { padding-right: 48px; }
  .search__clear {
    position: absolute; top: 0; right: 0; width: 44px; height: 100%; padding: 0;
    background: none; border: none; font: inherit; font-size: 22px; color: var(--mute); cursor: pointer;
  }
  .search__clear[hidden] { display: none; }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .found { margin-bottom: 8px; }
  .slot--hit { grid-template-columns: 1fr auto; padding-left: 16px; }
  .slot--hit .lbl { display: block; }
  .slot--hit .nl { display: block; font-size: 15px; margin-top: 3px; }
  .slot--hit .nl span { color: var(--mute); }
  .slot--hit .bx {
    font-family: var(--mono); font-size: 13px; font-weight: 700; padding: 4px 8px;
    background: var(--ink); color: var(--on-ink);
  }
  .slot--hit .bx[data-full="1"] { background: var(--signal); color: var(--on-signal); }
  mark {
    background: none; color: inherit; text-decoration: underline 2px var(--deep);
    text-underline-offset: 3px;
  }

  .make { display: flex; gap: 8px; margin-top: 22px; }
  .make input { flex: 1; min-width: 0; }
  .make .btn { flex: 0 0 auto; }

  .stage { perspective: 1200px; margin-bottom: 18px; }
  .flip {
    position: relative; width: 100%; min-height: 300px;
    transform-style: preserve-3d; cursor: pointer;
    transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .flip.turned { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--card); color: var(--ink); border: 1.5px solid var(--ink); padding: 22px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .face--back { transform: rotateY(180deg); background: var(--signal); color: var(--on-signal); border-color: var(--on-signal); }
  .word { font-size: 38px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.05; word-break: break-word; }
  .hint {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--mute);
  }
  .face--back .hint { color: var(--on-signal); }
  .mid { flex: 1; display: flex; align-items: center; }

  .rate { display: flex; gap: 8px; }
  .rate .btn { padding: 16px 10px; }
  .rate .no { background: var(--danger); border-color: var(--danger); color: var(--on-danger); }
  .rate .yes { background: var(--success); border-color: var(--success); color: var(--on-success); }
  .rate .no:active, .rate .yes:active { opacity: 0.85; }
  /* The edit cog sits inside each card face, top-right, in a 44px tap target. The speaker that
     reads the Dutch word sits beside it, on the back only. */
  .cog, .speak {
    position: absolute; top: 8px; right: 8px; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; padding: 0; color: var(--mute); cursor: pointer;
  }
  .speak { right: 52px; }
  .face--back .cog, .face--back .speak { color: var(--on-signal); }
  .cog svg, .speak svg { width: 22px; height: 22px; }
  .cog:focus-visible, .speak:focus-visible { outline: 3px solid var(--deep); outline-offset: -4px; }
  .face--back .cog:focus-visible, .face--back .speak:focus-visible { outline-color: var(--on-signal); }
  .btn--danger { border-color: var(--danger); color: var(--danger); }
  .btn--danger:active { background: var(--danger); color: var(--on-danger); }
  .edit { background: var(--card); border: 1.5px solid var(--ink); padding: 22px 22px 8px; margin-bottom: 18px; }

  label.field { display: block; margin-bottom: 14px; }
  label.field .eyebrow { display: block; margin-bottom: 5px; }
  input[type="text"], input[type="search"], textarea, select {
    width: 100%; -webkit-appearance: none; appearance: none; font: inherit; font-size: 17px; padding: 12px;
    border: 1.5px solid var(--ink); background-color: var(--card); color: var(--ink); border-radius: 0;
  }
  select {
    -webkit-appearance: none; appearance: none; padding-right: 36px;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%),
      linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
    background-size: 6px 6px; background-repeat: no-repeat;
  }
  textarea { min-height: 130px; font-size: 15px; font-family: var(--mono); }
  input:focus, textarea:focus, select:focus { outline: 3px solid var(--deep); outline-offset: -1px; }

  .note { font-size: 13px; line-height: 1.5; color: var(--mute); margin-top: 18px; }
  .empty { border: 1.5px dashed var(--line); padding: 26px 20px; text-align: center; }
  .empty p { font-size: 15px; line-height: 1.5; margin: 8px 0 0; }
  h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 16px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom));
    transform: translateX(-50%); background: var(--ink); color: var(--on-ink);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 11px 16px; z-index: 50;
  }
  .toast--undo { display: flex; align-items: center; gap: 16px; white-space: nowrap; padding: 8px 8px 8px 16px; }
  .toast--undo button {
    font: inherit; font-weight: 700; color: var(--on-ink-accent); background: none;
    border: none; cursor: pointer; padding: 6px 8px; letter-spacing: inherit; text-transform: inherit;
  }
  @media (prefers-reduced-motion: reduce) {
    .flip, .slot, .swipe .slot--deck { transition: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  var KEY = 'leitner-dutch-v1';
  var app = document.getElementById('app');
  var state = blank();
  var view = 'decks';
  var deckId = null;
  var session = null;
  var query = '';        /* the deck list's search text */
  var menuOpen = false;  /* the deck list's "⋯" menu */
  var foundId = null;    /* the card opened from search, shown in the edit form */

  /* Settings cog, from Feather Icons (MIT). */
  var COG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/>' +
    '<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 ' +
    '1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 ' +
    '19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 ' +
    '.33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 ' +
    '0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 ' +
    '1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 ' +
    '1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 ' +
    '0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';

  /* Speaker, from Feather Icons "volume-2" (MIT). */
  var SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>' +
    '<path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
  var CAN_SPEAK = 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';

  var STARTER = [
    ['the house','het huis'],['the water','het water'],['the bread','het brood'],
    ['tomorrow','morgen'],['always','altijd'],['together','samen'],
    ['to work','werken'],['to understand','begrijpen'],['expensive','duur'],
    ['busy','druk'],['nice / kind','aardig'],['almost','bijna']
  ];

  function blank() { return { cards: [], nextId: 1, decks: [], nextDeckId: 1 }; }
  function maxId(list) {
    return list.reduce(function (m, x) { return Math.max(m, x.id || 0); }, 0);
  }
  function findDeck(s, name) {
    var key = name.trim().toLowerCase();
    return s.decks.find(function (d) { return d.name.toLowerCase() === key; }) || null;
  }
  function makeDeck(s, name) {
    var d = { id: s.nextDeckId++, name: name, createdAt: Date.now() };
    s.decks.push(d);
    return d;
  }

  /* Brings saved or restored data up to the current shape. Data from before decks
     existed has no deckId on its cards: those go into a deck called Start, keeping their box. */
  function migrate(s) {
    if (!s || !Array.isArray(s.cards)) return null;
    if (!Array.isArray(s.decks)) s.decks = [];
    if (!s.nextId) s.nextId = maxId(s.cards) + 1;
    if (!s.nextDeckId) s.nextDeckId = maxId(s.decks) + 1;
    var ids = s.decks.map(function (d) { return d.id; });
    var loose = s.cards.filter(function (c) { return ids.indexOf(c.deckId) < 0; });
    if (loose.length) {
      var start = findDeck(s, 'Start') || makeDeck(s, 'Start');
      loose.forEach(function (c) { c.deckId = start.id; });
    }
    return s;
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var s = raw && migrate(JSON.parse(raw));
      if (s) { state = s; save(); }
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('Could not save'); }
  }

  function deck() { return state.decks.find(function (d) { return d.id === deckId; }) || null; }
  function cardsIn(id) { return state.cards.filter(function (c) { return c.deckId === id; }); }
  function inBox(n) { return cardsIn(deckId).filter(function (c) { return c.box === n; }); }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m];
    });
  }
  /* Reads a Dutch word aloud with the device's own voice, a Dutch one when it has one.
     A new tap restarts it. */
  function speak(text) {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'nl-NL';
    var nl = speechSynthesis.getVoices().find(function (v) { return /^nl\b/i.test(v.lang); });
    if (nl) u.voice = nl;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }
  function hush() { if (CAN_SPEAK) speechSynthesis.cancel(); }

  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 1800);
  }
  /* A toast with an undo button. It lives outside #app, so it gets its own listener.
     Only one is shown at a time: a newer one replaces it and its undo is lost. */
  var UNDO_MS = 5000, undoEl = null, undoTimer = null;
  function undoToast(msg, onUndo) {
    clearUndo();
    undoEl = document.createElement('div');
    undoEl.className = 'toast toast--undo';
    undoEl.innerHTML = '<span></span><button type="button">Undo</button>';
    undoEl.firstChild.textContent = msg;
    undoEl.lastChild.addEventListener('click', function () { clearUndo(); onUndo(); });
    document.body.appendChild(undoEl);
    undoTimer = setTimeout(clearUndo, UNDO_MS);
  }
  function clearUndo() {
    clearTimeout(undoTimer);
    if (undoEl) undoEl.remove();
    undoEl = null;
  }

  function go(v) { view = v; menuOpen = false; render(); }
  function open(id) { deckId = id; query = ''; go('home'); }

  /* Opens straight into the only deck, otherwise shows the deck list. */
  function launch() {
    if (state.decks.length === 1) { deckId = state.decks[0].id; view = 'home'; }
    else view = 'decks';
    render();
  }

  function header(tally) {
    return '<div class="top"><div class="wordmark">vijf<span>.</span></div>' +
      '<div class="tally">' + tally + '</div></div>';
  }
  function crumbs() {
    return '<span class="crumbs"><button data-go="decks">Decks</button><span>/</span>' +
      '<button class="here" data-go="home">' + esc(deck().name) + '</button></span>';
  }

  function decksView() {
    var n = state.decks.length;
    var h = '<div class="top' + (menuOpen ? ' top--open' : '') + '">' +
      '<div class="wordmark">vijf<span>.</span></div>' +
      '<button class="more" data-act="menu" aria-label="More" aria-haspopup="true" ' +
      'aria-expanded="' + menuOpen + '">⋯</button>' +
      (menuOpen ? '<div class="menu" role="menu">' +
        '<button role="menuitem" data-go="newdeck">New deck</button>' +
        '<button role="menuitem" data-go="backup">Backup</button></div>' : '') + '</div>';
    if (n) {
      h += '<div class="search"><input type="search" id="f-search" value="' + esc(query) + '" ' +
        'placeholder="Search all cards" aria-label="Search all cards" autocomplete="off" ' +
        'autocapitalize="none" spellcheck="false">' +
        '<button class="search__clear" data-act="search-clear" aria-label="Clear search"' +
        (query.trim() ? '' : ' hidden') + '>×</button></div>' +
        '<div id="list">' + listHtml() + '</div>';
    } else {
      h += '<div class="empty"><div class="eyebrow">Empty</div>' +
        '<p>Make a deck for each topic, like food or work.</p></div>' +
        '<div class="make"><input type="text" id="f-deck-name" placeholder="New deck" ' +
        'autocomplete="off" aria-label="New deck name">' +
        '<button class="btn btn--fill" data-act="make-deck">Create</button></div>';
    }
    if (!state.cards.length) {
      h += '<div class="row"><button class="btn btn--ghost" data-act="starter">' +
        'Load 12 starter words</button></div>';
    }
    return h;
  }

  /* Below the search field: the decks, or the cards matching the search. */
  function listHtml() {
    return query.trim() ? resultsHtml() : decksHtml();
  }

  function decksHtml() {
    var h = '<div class="tray">';
    state.decks.forEach(function (d) {
      var cs = cardsIn(d.id);
      var learned = cs.filter(function (c) { return c.box === 5; }).length;
      h += '<div class="swipe">' +
        '<button class="swipe__del" data-del-deck="' + d.id + '" tabindex="-1" ' +
        'aria-label="Delete deck ' + esc(d.name) + '">Delete</button>' +
        '<button class="slot slot--deck" data-deck="' + d.id + '" data-empty="' + (cs.length ? 0 : 1) + '">' +
        '<span><span class="lbl">' + esc(d.name) + '</span>' +
        '<span class="sub">' + cs.length + (cs.length === 1 ? ' card' : ' cards') + '</span></span>' +
        '<span class="cnt">' + learned + '<small>/' + cs.length + '</small></span></button></div>';
    });
    return h + '</div><p class="note">Each deck has its own five boxes. The number on the right ' +
      'shows how many cards you have learned. Swipe a deck left to delete it.</p>';
  }

  function resultsHtml() {
    var hits = search();
    var h = '<div class="eyebrow found">' + (hits.length ?
      hits.length + (hits.length === 1 ? ' card' : ' cards') : 'No cards match') + '</div>';
    if (!hits.length) return h;
    h += '<div class="tray">';
    hits.forEach(function (hit) {
      var c = hit.card;
      h += '<button class="slot slot--hit" data-card="' + c.id + '">' +
        '<span><span class="lbl">' + marked(c.native) + '</span>' +
        '<span class="nl">' + marked(c.dutch) + ' <span>· ' + esc(hit.deck.name) + '</span></span></span>' +
        '<span class="bx" data-full="' + (c.box === 5 ? 1 : 0) + '" aria-label="Box ' + c.box + '">' +
        c.box + '</span></button>';
    });
    return h + '</div>';
  }

  /* Search ignores case and accents: "cafe" finds "café". fold() lowers a string and drops its
     accents, remembering for each folded character where it came from, so a match can be
     marked in the original text. */
  function fold(s) {
    var text = '', at = [];
    for (var i = 0; i < s.length; i++) {
      var f = s[i].normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
      for (var k = 0; k < f.length; k++) { text += f[k]; at.push(i); }
    }
    return { text: text, at: at };
  }
  /* Where the search text occurs in s, as [start, end) in s, or null. */
  function match(s) {
    var q = fold(query.trim()).text, f = fold(s);
    var i = q ? f.text.indexOf(q) : -1;
    return i < 0 ? null : [f.at[i], f.at[i + q.length - 1] + 1];
  }
  function marked(s) {
    var m = match(s);
    if (!m) return esc(s);
    return esc(s.slice(0, m[0])) + '<mark>' + esc(s.slice(m[0], m[1])) + '</mark>' + esc(s.slice(m[1]));
  }
  /* Matching cards in every deck, in deck order and then in the order they were added. */
  function search() {
    var hits = [];
    state.decks.forEach(function (d) {
      cardsIn(d.id).forEach(function (c) {
        if (match(c.native) || match(c.dutch)) hits.push({ card: c, deck: d });
      });
    });
    return hits;
  }

  function newDeckView() {
    return '<div class="bar"><button data-go="decks">← Decks</button><span>New deck</span></div>' +
      '<label class="field"><span class="eyebrow">Name</span>' +
      '<input type="text" id="f-deck-name" autocomplete="off" autofocus></label>' +
      '<div class="row" style="margin-top:4px"><button class="btn btn--fill" data-act="make-deck">' +
      'Create</button></div>';
  }

  function homeView() {
    var names = ['New', 'Shaky', 'Getting there', 'Nearly', 'Learned'];
    var total = cardsIn(deckId).length;
    var h = '<div class="bar"><button data-go="decks">← Decks</button>' +
      '<span class="here">' + esc(deck().name) + '</span></div>' +
      header('<b>' + inBox(5).length + '</b> / ' + total + '<br>learned') + '<div class="tray">';
    for (var i = 1; i <= 5; i++) {
      var n = inBox(i).length, edges = '';
      for (var e = 0; e < Math.min(n, 20); e++) edges += '<i></i>';
      h += '<button class="slot" data-go="box' + i + '" data-empty="' + (n ? 0 : 1) +
        '" data-full="' + (i === 5 && n ? 1 : 0) + '">' +
        '<span class="num">' + i + '</span><span>' +
        '<span class="lbl">' + names[i - 1] + '</span>' +
        (n ? '<span class="edges">' + edges + '</span>' : '') +
        '</span><span class="cnt">' + n + '</span></button>';
    }
    h += '</div>';
    if (!total) {
      h += '<div class="empty" style="margin-top:22px"><div class="eyebrow">Empty</div>' +
        '<p>Add your first word. It starts in box 1.</p></div>';
    }
    h += '<div class="row">' +
      '<button class="btn btn--fill" data-go="add">Add words</button></div>';
    h += '<p class="note">Tap a box to study it. <b>I know it</b> moves a card up one box; ' +
      '<b>Not yet</b> keeps it where it is. Cards never move down. ' +
      'Use the cog on a card to fix or delete it.</p>';
    return h;
  }

  function studyView() {
    if (!session || !session.queue.length) return summaryView();
    var card = state.cards.find(function (c) { return c.id === session.queue[0]; });
    if (!card) { advance(session); return studyView(); }
    if (session.editing) return editView(card);
    var readonly = session.box === 5;
    var cog = '<button class="cog" data-act="edit" aria-label="Edit card">' + COG + '</button>';
    var speaker = CAN_SPEAK ?
      '<button class="speak" data-act="speak" aria-label="Say the Dutch word">' + SPEAKER + '</button>' : '';

    var h = '<div class="bar">' + crumbs() +
      '<span class="pos">' + (session.total - session.queue.length + 1) + ' / ' + session.total + '</span></div>' +
      '<div class="stage"><div class="flip" id="flip">' +
      '<div class="face"><span class="hint">Your language</span>' +
      '<div class="mid"><div class="word">' + esc(card.native) + '</div></div>' +
      '<span class="hint">Tap to flip</span>' + cog + '</div>' +
      '<div class="face face--back"><span class="hint">Dutch</span>' +
      '<div class="mid"><div class="word">' + esc(card.dutch) + '</div></div>' +
      '<span class="hint">' + (readonly ? 'Learned. Stays in box 5' : 'Did you know it?') +
      '</span>' + speaker + cog + '</div></div></div>';

    if (readonly) {
      h += '<div class="rate">' +
        '<button class="btn btn--fill" data-act="next">Next</button></div>';
    } else {
      h += '<div class="rate">' +
        '<button class="btn no" data-act="no">Not yet<small>stays in box ' + session.box + '</small></button>' +
        '<button class="btn yes" data-act="yes">I know it<small>→ box ' + (session.box + 1) + '</small></button></div>';
    }
    return h;
  }

  /* Shown in place of the study card while session.editing is set, and for a card opened
     from search (view 'card'), where the back button returns to the results. */
  function editView(card) {
    var back = view === 'card' ? '<button data-act="edit-cancel">← Search</button>' : crumbs();
    return '<div class="bar">' + back + '<span>Edit</span></div>' +
      '<div class="edit">' +
      '<label class="field"><span class="eyebrow">Your language</span>' +
      '<input type="text" id="f-edit-native" value="' + esc(card.native) + '" autocomplete="off" autocapitalize="none"></label>' +
      '<label class="field"><span class="eyebrow">Dutch</span>' +
      '<input type="text" id="f-edit-dutch" value="' + esc(card.dutch) + '" autocomplete="off" autocapitalize="none"></label>' +
      '</div>' +
      '<div class="rate">' +
      '<button class="btn" data-act="edit-cancel">Cancel</button>' +
      '<button class="btn btn--fill" data-act="edit-save">Save</button></div>' +
      '<div class="row"><button class="btn btn--danger" data-act="edit-delete">' +
      'Delete card</button></div>';
  }

  function summaryView() {
    var h = '<div class="bar">' + crumbs() + '<span>Done</span></div>' +
      '<h2>Round complete.</h2>';
    if (session) {
      h += '<p class="note" style="margin-top:0">Moved up to box ' + Math.min(session.box + 1, 5) + ': ' +
        session.up + '. Not yet: ' + session.held + '.</p>';
    }
    h += '<div class="row"><button class="btn btn--fill" data-go="home">' +
      'Back to boxes</button>' +
      '<button class="btn" data-go="decks">Other deck</button></div>';
    return h;
  }

  function addView() {
    var opts = state.decks.map(function (d) {
      return '<option value="' + d.id + '"' + (d.id === deckId ? ' selected' : '') + '>' +
        esc(d.name) + '</option>';
    }).join('');
    return '<div class="bar"><button data-go="home">← Boxes</button><span>Add</span></div>' +
      '<label class="field"><span class="eyebrow">Deck</span>' +
      '<select id="f-deck">' + opts + '</select></label>' +
      '<h2 style="margin-top:28px">New word</h2>' +
      '<label class="field"><span class="eyebrow">Your language</span>' +
      '<input type="text" id="f-native" autocomplete="off" autocapitalize="none"></label>' +
      '<label class="field"><span class="eyebrow">Dutch</span>' +
      '<input type="text" id="f-dutch" autocomplete="off" autocapitalize="none"></label>' +
      '<div class="row" style="margin-top:4px"><button class="btn btn--fill" data-act="save-one">' +
      'Save to box 1</button></div>' +
      '<h2 style="margin-top:34px">Several at once</h2>' +
      '<label class="field"><span class="eyebrow">One per line: your word = Dutch word</span>' +
      '<textarea id="f-bulk" placeholder="the house = het huis&#10;tomorrow = morgen"></textarea></label>' +
      '<div class="row" style="margin-top:0"><button class="btn" data-act="save-bulk">' +
      'Import list</button></div>';
  }

  function backupView() {
    return '<div class="bar"><button data-go="decks">← Decks</button><span>Backup</span></div>' +
      '<h2>Backup</h2>' +
      '<p class="note" style="margin-top:0">Your cards live only on this device. Copy this text ' +
      'somewhere safe. To restore, paste it here and tap Restore. This replaces everything.</p>' +
      '<label class="field"><span class="eyebrow">Your data</span>' +
      '<textarea id="f-json">' + esc(JSON.stringify(state)) + '</textarea></label>' +
      '<div class="row" style="margin-top:0">' +
      '<button class="btn" data-act="copy">Copy</button>' +
      '<button class="btn btn--fill" data-act="restore">Restore</button></div>';
  }

  function foundCard() { return state.cards.find(function (c) { return c.id === foundId; }) || null; }

  function render() {
    var v = { decks: decksView, home: homeView, study: studyView, add: addView, backup: backupView,
      newdeck: newDeckView, card: function () { return editView(foundCard()); } };
    if (!v[view] || (/^(home|study|add)$/.test(view) && !deck()) || (view === 'card' && !foundCard())) {
      view = 'decks';
    }
    hush();
    app.innerHTML = v[view]();
    window.scrollTo(0, 0);
    var auto = app.querySelector('[autofocus]');
    if (auto) auto.focus();
  }

  function startBox(n) {
    var ids = inBox(n).map(function (c) { return c.id; });
    if (!ids.length) { toast('Box ' + n + ' is empty'); return; }
    for (var i = ids.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = ids[i]; ids[i] = ids[j]; ids[j] = t;
    }
    /* A study session runs in rounds. queue holds the rest of the current round and total its
       size, so the position shown is total - queue.length + 1. "Not yet" cards collect in retry
       and become the next round; no answer ever changes the current round's total. */
    session = { box: n, queue: ids, retry: [], total: ids.length, up: 0, held: 0 };
    go('study');
  }

  /* Moves past the current card; when the round runs out, the "Not yet" cards start the next. */
  function advance(s) {
    s.queue.shift();
    if (!s.queue.length && s.retry.length) {
      s.queue = s.retry;
      s.retry = [];
      s.total = s.queue.length;
    }
  }

  function rate(liked) {
    var id = session.queue[0];
    var card = state.cards.find(function (c) { return c.id === id; });
    if (!card) { advance(session); render(); return; }
    if (liked) {
      card.box = Math.min(card.box + 1, 5);
      card.reviewedAt = Date.now();
      session.up++;
    } else {
      session.held++;
      session.retry.push(id);
    }
    advance(session);
    save();
    render();
  }

  function addCard(native, dutch, toDeck) {
    if (!native || !dutch) return false;
    state.cards.push({
      id: state.nextId++, deckId: toDeck, native: native, dutch: dutch,
      box: 1, createdAt: Date.now(), reviewedAt: null
    });
    return true;
  }
  function chosenDeck() { return parseInt(document.getElementById('f-deck').value, 10); }

  function currentCard() {
    return state.cards.find(function (c) { return c.id === session.queue[0]; });
  }

  /* Deletes the card being studied and moves on. Undo puts it back, and makes it the
     current card again if that study session is still on screen. */
  function deleteCard() {
    var s = session, gone = currentCard();
    var at = state.cards.indexOf(gone);
    state.cards.splice(at, 1);
    s.total--;
    advance(s);
    s.editing = false;
    save(); render();
    undoToast('Card deleted', function () {
      state.cards.splice(Math.min(at, state.cards.length), 0, gone);
      if (session === s && view === 'study') { s.queue.unshift(gone.id); s.total++; }
      save(); render(); toast('Restored');
    });
  }

  /* Deletes the card opened from search and goes back to the results; undo puts it back. */
  function deleteFound() {
    var gone = foundCard(), at = state.cards.indexOf(gone);
    state.cards.splice(at, 1);
    save(); go('decks');
    undoToast('Card deleted', function () {
      state.cards.splice(Math.min(at, state.cards.length), 0, gone);
      save(); render(); toast('Restored');
    });
  }

  /* Swipe-to-delete on deck rows. A horizontal drag past half the button width opens
     the row; a vertical move lets the page scroll instead. */
  var SWIPE = 96, drag = null, swallowClick = false;
  function closeSwipes() {
    Array.prototype.forEach.call(app.querySelectorAll('.swipe.open'), function (s) {
      s.classList.remove('open');
    });
  }
  app.addEventListener('pointerdown', function (ev) {
    swallowClick = false;
    var row = ev.target.closest('.slot--deck');
    if (!row) return;
    drag = { row: row, id: ev.pointerId, x: ev.clientX, y: ev.clientY, dx: 0, on: false,
      base: row.parentNode.classList.contains('open') ? -SWIPE : 0 };
  });
  app.addEventListener('pointermove', function (ev) {
    if (!drag || ev.pointerId !== drag.id) return;
    var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (!drag.on) {
      if (Math.abs(dy) > 10) { drag = null; return; }
      if (Math.abs(dx) < 10) return;
      drag.on = true;
      drag.row.style.transition = 'none';
      try { drag.row.setPointerCapture(ev.pointerId); } catch (e) {}
    }
    drag.dx = dx;
    var off = Math.max(-SWIPE, Math.min(0, drag.base + dx));
    drag.row.style.width = 'calc(100% - ' + -off + 'px)';
  });
  function endDrag() {
    if (!drag) return;
    if (drag.on) {
      var open = drag.base + drag.dx < -SWIPE / 2;
      drag.row.style.transition = '';
      drag.row.style.width = '';
      closeSwipes();
      if (open) drag.row.parentNode.classList.add('open');
      swallowClick = true;
    }
    drag = null;
  }
  app.addEventListener('pointerup', endDrag);
  app.addEventListener('pointercancel', endDrag);

  /* Typing in the search field redraws only the list below it, so the field keeps focus. */
  app.addEventListener('input', function (ev) {
    if (ev.target.id !== 'f-search') return;
    query = ev.target.value;
    document.getElementById('list').innerHTML = listHtml();
    app.querySelector('.search__clear').hidden = !query.trim();
  });

  /* Escape closes the menu wherever the focus is (opening it re-renders, so focus is lost). */
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && menuOpen) { menuOpen = false; render(); }
  });

  app.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    if (ev.target.id === 'f-search') { ev.target.blur(); return; }
    if (ev.target.id === 'f-deck-name') app.querySelector('[data-act="make-deck"]').click();
    if (/^f-edit-/.test(ev.target.id)) app.querySelector('[data-act="edit-save"]').click();
  });

  app.addEventListener('click', function (ev) {
    if (swallowClick) { swallowClick = false; return; }
    var el = ev.target.closest('[data-go],[data-act],[data-del-deck],[data-deck],[data-card],#flip');

    var delDeck = el && el.getAttribute('data-del-deck');
    if (delDeck) {
      var gone = parseInt(delDeck, 10);
      var at = state.decks.findIndex(function (d) { return d.id === gone; });
      var deckGone = state.decks[at];
      var cardsGone = state.cards.filter(function (c) { return c.deckId === gone; });
      state.decks.splice(at, 1);
      state.cards = state.cards.filter(function (c) { return c.deckId !== gone; });
      if (deckId === gone) deckId = null;
      save(); render();
      undoToast('Deck deleted', function () {
        state.decks.splice(Math.min(at, state.decks.length), 0, deckGone);
        state.cards = state.cards.concat(cardsGone);
        save(); render(); toast('Restored');
      });
      return;
    }

    /* While a row is swiped open, any other tap just closes it. */
    if (app.querySelector('.swipe.open')) { closeSwipes(); return; }

    /* While the menu is open, a tap on anything but its items just closes it. */
    if (menuOpen && !(el && el.closest('.menu'))) { menuOpen = false; render(); return; }

    if (!el) return;

    if (el.id === 'flip') { el.classList.toggle('turned'); return; }

    var openDeck = el.getAttribute('data-deck');
    if (openDeck) { open(parseInt(openDeck, 10)); return; }

    var openCard = el.getAttribute('data-card');
    if (openCard) { foundId = parseInt(openCard, 10); go('card'); return; }

    var goTo = el.getAttribute('data-go');
    if (goTo) {
      if (goTo.indexOf('box') === 0) startBox(parseInt(goTo.slice(3), 10));
      else go(goTo);
      return;
    }

    var act = el.getAttribute('data-act');
    var fromSearch = view === 'card';
    if (act === 'menu') { menuOpen = true; render(); }
    else if (act === 'search-clear') {
      query = ''; render();
      document.getElementById('f-search').focus();
    }
    else if (act === 'yes') rate(true);
    else if (act === 'no') rate(false);
    else if (act === 'next') { advance(session); render(); }
    else if (act === 'speak') speak(currentCard().dutch);
    else if (act === 'edit') { session.editing = true; render(); }
    else if (act === 'edit-cancel') {
      if (fromSearch) go('decks');
      else { session.editing = false; render(); }
    }
    else if (act === 'edit-save') {
      var en = document.getElementById('f-edit-native').value.trim();
      var ed = document.getElementById('f-edit-dutch').value.trim();
      if (!en || !ed) { toast('Fill in both fields'); return; }
      var edited = fromSearch ? foundCard() : currentCard();
      edited.native = en; edited.dutch = ed;
      save();
      if (fromSearch) go('decks');
      else { session.editing = false; render(); }
      toast('Saved');
    }
    else if (act === 'edit-delete') {
      if (fromSearch) deleteFound();
      else deleteCard();
    }
    else if (act === 'starter') {
      var start = findDeck(state, 'Start') || makeDeck(state, 'Start');
      STARTER.forEach(function (p) { addCard(p[0], p[1], start.id); });
      save(); open(start.id); toast('12 words added to box 1');
    }
    else if (act === 'make-deck') {
      var name = document.getElementById('f-deck-name').value.trim();
      if (!name) { toast('Give the deck a name'); return; }
      if (findDeck(state, name)) { toast('That deck already exists'); return; }
      var made = makeDeck(state, name);
      save(); open(made.id); toast('Deck created');
    }
    else if (act === 'save-one') {
      var n = document.getElementById('f-native').value.trim();
      var d = document.getElementById('f-dutch').value.trim();
      if (!n || !d) { toast('Fill in both fields'); return; }
      deckId = chosenDeck();
      addCard(n, d, deckId); save();
      document.getElementById('f-native').value = '';
      document.getElementById('f-dutch').value = '';
      document.getElementById('f-native').focus();
      toast('Added to box 1');
    }
    else if (act === 'save-bulk') {
      var raw = document.getElementById('f-bulk').value, count = 0;
      deckId = chosenDeck();
      raw.split('\n').forEach(function (line) {
        if (!line.trim()) return;
        var parts = line.split(/\s*[=|\t;]\s*/);
        if (parts.length < 2) parts = line.split(/\s*,\s*/);
        if (parts.length < 2) return;
        if (addCard(parts[0].trim(), parts[1].trim(), deckId)) count++;
      });
      if (!count) { toast('No valid lines found'); return; }
      save(); render(); toast(count + ' words added');
    }
    else if (act === 'copy') {
      var ta = document.getElementById('f-json');
      ta.select(); ta.setSelectionRange(0, 999999);
      try { document.execCommand('copy'); toast('Copied'); }
      catch (e) { toast('Select the text and copy it'); }
    }
    else if (act === 'restore') {
      try {
        var data = migrate(JSON.parse(document.getElementById('f-json').value));
        if (!data) throw new Error('bad');
        clearUndo();
        state = data;
        query = '';
        save(); launch(); toast('Restored');
      } catch (e) { toast('Invalid backup'); }
    }
  });

  load();
  launch();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
