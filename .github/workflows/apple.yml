name: Apple

# The iOS app and the shared VijfKit package in apple/. Runs only when apple/ or design/
# changes. Nothing deploys from here yet; installing on devices is done from Xcode.
on:
  push:
    branches: [main]
    paths: ['apple/**', 'design/**', '.github/workflows/apple.yml']
  pull_request:
    paths: ['apple/**', 'design/**', '.github/workflows/apple.yml']
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch; on main runs wait their turn instead of being cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: VijfKit unit tests
        working-directory: apple/VijfKit
        run: swift test

      - name: Build the app and run its tests on an iPhone simulator
        working-directory: apple
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')))")
          echo "Simulator: $UDID"
          xcodebuild test -project Vijf.xcodeproj -scheme Vijf \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
