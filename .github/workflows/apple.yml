name: Apple

# The iOS app and the shared VijfKit package in apple/. Runs only when apple/ or design/
# changes (on a pull request the tests are skipped instead, so the required check still
# reports). Nothing deploys from here yet; installing on devices is done from Xcode.
on:
  push:
    branches: [main]
    paths: ['apple/**', 'design/**', '.github/workflows/apple.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch; on main runs wait their turn instead of being cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests always start this workflow, so the required check below always reports.
  # This job decides whether the tests are needed; when they're skipped, GitHub counts the
  # skipped check as passing. Pushes and manual runs always test.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ] || git diff --name-only "$BASE...$HEAD" | grep -qE '^(apple/|design/|\.github/workflows/apple\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changes in apple/ or design/: tests skipped."
          fi

  apple-tests:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: VijfKit unit tests
        working-directory: apple/VijfKit
        run: swift test

      - name: Build the app and run its tests on an iPhone simulator
        working-directory: apple
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')))")
          echo "Simulator: $UDID"
          xcodebuild test -project Vijf.xcodeproj -scheme Vijf \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
