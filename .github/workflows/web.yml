name: Web

# The PWA in web/. Tests run on every pull request and every push to main; only a push to
# main deploys, and only when the tests pass. Changes outside web/ and design/ skip this.
on:
  push:
    branches: [main]
    paths: ['web/**', 'design/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'design/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch. On main nothing is cancelled: runs wait their turn, and if
# several pile up GitHub keeps only the newest waiting one, so the last deploy is always the
# latest commit. On pull requests an older run is cancelled when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never two deploys at once, and a running deploy is never cut off.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          cp -R web/index.html web/manifest.webmanifest web/sw.js web/icons _site/

      - name: Stamp cache version with commit
        run: |
          sed -i "s/^const CACHE = .*/const CACHE = 'vijf-${GITHUB_SHA::7}';/" _site/sw.js
          grep -q "^const CACHE = 'vijf-${GITHUB_SHA::7}';" _site/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
