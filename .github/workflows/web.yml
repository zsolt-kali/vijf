name: Web

# The PWA in web/. Tests run on every pull request and every push to main; only a push to
# main deploys, and only when the tests pass. Pushes outside web/ and design/ skip this; on a
# pull request the tests are skipped instead, so the required check still reports.
on:
  push:
    branches: [main]
    paths: ['web/**', 'design/**', '.github/workflows/web.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch. On main nothing is cancelled: runs wait their turn, and if
# several pile up GitHub keeps only the newest waiting one, so the last deploy is always the
# latest commit. On pull requests an older run is cancelled when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests always start this workflow, so the required check below always reports.
  # This job decides whether the tests are needed; when they're skipped, GitHub counts the
  # skipped check as passing. Pushes and manual runs always test.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ] || git diff --name-only "$BASE...$HEAD" | grep -qE '^(web/|design/|\.github/workflows/web\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changes in web/ or design/: tests skipped."
          fi

  web-tests:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  deploy:
    needs: web-tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never two deploys at once, and a running deploy is never cut off.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          cp -R web/index.html web/manifest.webmanifest web/sw.js web/icons _site/

      - name: Stamp cache version with commit
        run: |
          sed -i "s/^const CACHE = .*/const CACHE = 'vijf-${GITHUB_SHA::7}';/" _site/sw.js
          grep -q "^const CACHE = 'vijf-${GITHUB_SHA::7}';" _site/sw.js

      - name: Stamp the version shown on the Backup screen
        run: |
          VERSION="${GITHUB_SHA::7} · $(git log -1 --format=%cd --date=format:'%-d %b %Y')"
          sed -i "s/^  var VERSION = .*/  var VERSION = '${VERSION}';/" _site/index.html
          grep -q "^  var VERSION = '${VERSION}';" _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
